<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Multi Live Chat · TikTok Alerts</title>
    <link rel="stylesheet" href="/alerts.css">
    <script type="module" src="/alerts.js"></script>
  </head>
  <body>
    <article id="alert" hidden>
      <div id="art" aria-hidden="true"></div>
      <div class="details">
        <div class="kind"><span id="kind"></span><span class="brand">by @CrafOps</span></div>
        <div class="user"><span id="avatar"></span><strong id="name"></strong></div>
        <div id="description"></div>
        <div class="progress"></div>
      </div>
    </article>
  </body>
</html>
